<style>
  html, body { background: #000; }
  body { color: #f4ecdc; }
  .footer { display: none !important; }

  /* the scene fills the screen; the dark gathers on the right where the card sits.
     pages set auth_backdrop (and optionally auth_backdrop_pos / auth_backdrop_pos_sm) before including this;
     auth_panel=true shows a tall portrait image as a side panel bleeding off the left edge instead */
  .auth-backdrop {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: url('{{ url_for("views.themes", path=auth_backdrop) }}') {{ auth_backdrop_pos | default("30% center") }} / cover no-repeat;
  }

  .auth-backdrop::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(0, 0, 0, 0.05) 0%, rgba(0, 0, 0, 0.3) 35%, rgba(0, 0, 0, 0.8) 60%, rgba(0, 0, 0, 0.9) 100%),
      linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.2) 20%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.5) 85%, #000 100%);
  }

  {% if auth_panel %}
  .auth-backdrop {
    right: auto;
    width: min(52vw, 820px);
    -webkit-mask-image: linear-gradient(90deg, #000 45%, transparent 100%), linear-gradient(180deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(90deg, #000 45%, transparent 100%), linear-gradient(180deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
    mask-composite: intersect;
  }

  .auth-backdrop::after { background: rgba(0, 0, 0, 0.12); }
  {% endif %}

  .auth {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    min-height: calc(100vh - 80px);
    max-width: 1180px;
    padding-top: 2rem;
    padding-bottom: 3rem;
  }

  .auth-card {
    container-type: inline-size;
    width: min(100%, 460px);
    margin-right: 4%;
    padding: 2.6rem 2.4rem 2.2rem;
    border: 1px solid rgba(var(--acc-rgb), 0.3);
    border-radius: 22px;
    background: rgba(10, 9, 7, 0.68);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    font-family: 'Voyage Serif', system-ui, sans-serif;
  }

  .auth-title {
    margin: 0 0 0.4rem;
    font-family: 'Voyage Display', 'Voyage Serif', sans-serif;
    font-weight: 700;
    font-size: min(2.45rem, 9cqi);
    white-space: nowrap;
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--acc-light);
  }

  /* a longer title, kept to one line */
  .auth-title--long { font-size: min(2.2rem, 8.6cqi); }

  .auth-sub {
    margin: 0 0 2rem;
    font-weight: 500;
    font-size: 1.15rem;
    color: rgba(244, 236, 220, 0.65);
  }

  .auth-card .mb-3 { margin-bottom: 1.25rem !important; }

  .auth-card b, .auth-card .form-label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 600;
    font-size: 0.74rem;
    letter-spacing: 0;
    color: var(--acc);
  }

  .auth-card .form-control, .auth-card .form-select {
    height: 52px;
    padding: 0 1.1rem;
    border: 1px solid rgba(var(--acc-rgb), 0.22);
    border-radius: 14px;
    background-color: rgba(255, 255, 255, 0.035);
    color: #f4ecdc;
    font-family: 'Voyage Serif', system-ui, sans-serif;
    font-weight: 500;
    font-size: 1rem;
    font-variant-numeric: lining-nums;
    transition: border-color 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
  }

  .auth-card .form-control:focus, .auth-card .form-select:focus {
    border-color: rgba(var(--acc-rgb), 0.7);
    background-color: rgba(255, 255, 255, 0.055);
    color: #f4ecdc;
    box-shadow: 0 0 0 4px rgba(var(--acc-rgb), 0.12);
    outline: none;
  }

  .auth-card .form-control:-webkit-autofill {
    -webkit-text-fill-color: #f4ecdc;
    -webkit-box-shadow: 0 0 0 40px #15120d inset;
    caret-color: #f4ecdc;
  }

  .auth-card .form-text, .auth-card .text-muted {
    display: block;
    margin-top: 0.4rem;
    font-size: 0.92rem;
    color: rgba(244, 236, 220, 0.45) !important;
  }

  /* the submit: the site's primary button */
  .auth-submit {
    width: 100%;
    height: 48px;
    margin-top: 0.6rem;
    border: 0;
    border-radius: var(--btn-radius);
    background: var(--btn-primary-bg);
    color: var(--acc-ink);
    font-family: 'Voyage Serif', system-ui, sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0;
    box-shadow: var(--btn-primary-shadow);
    text-shadow: 0 1px 0 rgba(255, 245, 220, 0.35);
    transition: background 0.25s var(--btn-ease), box-shadow 0.3s var(--btn-ease), transform 0.25s var(--btn-ease);
  }

  .auth-submit:hover { background: var(--btn-primary-bg-hover); box-shadow: var(--btn-primary-shadow-hover); transform: translateY(-1px); }
  .auth-submit:focus-visible { outline: 2px solid var(--acc-light); outline-offset: 2px; }
  .auth-submit:active { transform: scale(0.985); }

  .auth-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin: -0.2rem 0 1.2rem;
  }

  .auth-card a { color: var(--acc); text-decoration: none; transition: color 0.2s ease; }
  .auth-card a:hover { color: var(--acc-light); }

  .auth-forgot { font-size: 1rem; }

  .auth-switch {
    margin: 1.8rem 0 0;
    padding-top: 1.4rem;
    border-top: 1px solid rgba(var(--acc-rgb), 0.15);
    text-align: center;
    font-size: 1.05rem;
    color: rgba(244, 236, 220, 0.6);
  }

  .auth-switch a { font-weight: 600; letter-spacing: 0.04em; }

  .auth-legal {
    margin: 1rem 0 0;
    text-align: center;
    font-size: 0.92rem;
    color: rgba(244, 236, 220, 0.5);
  }

  .auth-oauth {
    display: block;
    width: 100%;
    margin-bottom: 1.4rem;
    padding: 0.85rem;
    border: 1px solid rgba(var(--acc-rgb), 0.3);
    border-radius: 10px;
    text-align: center;
    font-weight: 600;
  }

  .auth-card .alert { border-radius: 14px; font-family: 'Voyage Serif', system-ui, sans-serif; font-size: 0.95rem; }

  /* short guidance inside a card */
  .auth-note {
    margin: -0.6rem 0 1.6rem;
    font-size: 0.95rem;
    line-height: 1.55;
    color: rgba(244, 236, 220, 0.72);
  }

  /* wider card for a choice of paths */
  .auth-card--wide { width: min(100%, 560px); }

  .auth-choices {
    display: grid;
    gap: 0.9rem;
  }

  .auth-choice {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    padding: 1.15rem 1.2rem;
    border: 1px solid rgba(var(--acc-rgb), 0.22);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.025);
    color: #f4ecdc !important;
    text-decoration: none;
    transition: border-color 0.25s ease, background-color 0.25s ease, transform 0.25s ease;
  }

  .auth-choice:hover, .auth-choice:focus-visible {
    border-color: rgba(var(--acc-rgb), 0.6);
    background: rgba(var(--acc-rgb), 0.07);
    transform: translateY(-2px);
    outline: none;
  }

  .auth-choice-icon {
    display: grid;
    place-items: center;
    flex: none;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid rgba(var(--acc-rgb), 0.4);
    background: radial-gradient(circle at 35% 30%, rgba(var(--acc-rgb), 0.25), rgba(var(--acc-rgb), 0.05));
    color: var(--acc-light);
    font-size: 1.15rem;
  }

  .auth-choice-text { flex: 1; min-width: 0; }

  .auth-choice-title {
    display: block;
    margin-bottom: 0.15rem;
    font-family: 'Voyage Serif', system-ui, sans-serif;
    font-size: 1rem;
    letter-spacing: 0;
    color: var(--acc-light);
  }

  .auth-choice-desc {
    display: block;
    font-size: 0.95rem;
    line-height: 1.4;
    color: rgba(244, 236, 220, 0.62);
  }

  .auth-choice-arrow {
    flex: none;
    color: var(--acc);
    font-size: 0.9rem;
    transition: transform 0.25s ease;
  }

  .auth-choice:hover .auth-choice-arrow { transform: translateX(4px); }

  .auth-choice--official { border-color: rgba(var(--acc-rgb), 0.45); background: rgba(var(--acc-rgb), 0.06); }

  .auth-or {
    margin: 0.4rem 0;
    text-align: center;
    font-size: 1rem;
    color: rgba(244, 236, 220, 0.5);
  }

  /* themed messages from the server */
  .auth-card .alert {
    margin-bottom: 1.4rem;
    padding: 0.85rem 1.1rem;
    border: 1px solid rgba(var(--acc-rgb), 0.3);
    background: rgba(var(--acc-rgb), 0.07);
    color: #f4ecdc;
  }

  .auth-card .alert-danger { border-color: rgba(196, 71, 59, 0.55); background: rgba(196, 71, 59, 0.12); color: #f3d0c8; }
  .auth-card .alert-success { border-color: rgba(122, 170, 110, 0.5); background: rgba(122, 170, 110, 0.1); color: #d8ecd0; }
  .auth-card .alert .btn-close { filter: invert(1) grayscale(1) brightness(1.6); opacity: 0.6; }

  @media (max-width: 767px) {
    .auth-backdrop { width: 100%; background-position: {{ auth_backdrop_pos_sm | default("40% center") }}; }
    .auth-backdrop::after { background: linear-gradient(180deg, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.82)); }
    .auth { justify-content: center; min-height: calc(100vh - 70px); }
    .auth-card { margin-right: 0; padding: 2rem 1.5rem 1.6rem; }
  }
</style>
