<style>
  /* ===== Popups: modals, toasts, tooltips, snackbar =====
     Loaded inside the stylesheets block, straight after main.scss, so a page that
     restyles its own modals (teams, challenge window) still wins the cascade. */

  /* muted cream close cross; also cancels Bootstrap's dark-mode invert filter */
  .modal .btn-close,
  .toast .btn-close,
  #ctfdio-snackbar-email-nudge .btn-close {
    --bs-btn-close-bg: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%23f4ecdc'%3e%3cpath d='M.293.293a1 1 0 0 1 1.414 0L8 6.586 14.293.293a1 1 0 1 1 1.414 1.414L9.414 8l6.293 6.293a1 1 0 0 1-1.414 1.414L8 9.414l-6.293 6.293a1 1 0 0 1-1.414-1.414L6.586 8 .293 1.707a1 1 0 0 1 0-1.414z'/%3e%3c/svg%3e");
    --bs-btn-close-white-filter: none;
    --bs-btn-close-opacity: 0.45;
    --bs-btn-close-hover-opacity: 0.9;
    --bs-btn-close-focus-shadow: 0 0 0 0.2rem rgba(var(--acc-rgb), 0.3);
    filter: none;
  }

  /* ----- any modal ----- */
  .modal {
    --bs-modal-bg: #0b0a08;
    --bs-modal-color: #f4ecdc;
    --bs-modal-border-color: rgba(244, 236, 220, 0.12);
    --bs-modal-border-radius: 12px;
    --bs-modal-inner-border-radius: 11px;
    --bs-modal-box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.8);
    --bs-modal-header-border-color: rgba(244, 236, 220, 0.1);
    --bs-modal-footer-border-color: rgba(244, 236, 220, 0.1);
  }
  .modal-content { box-shadow: var(--bs-modal-box-shadow); }
  .modal-title {
    font-family: 'Voyage Uncial', 'Voyage Display', serif;
    font-weight: 400;
    color: var(--acc-light);
  }

  .modal-backdrop {
    --bs-backdrop-bg: #030201;
    --bs-backdrop-opacity: 0.75;
  }

  /* ----- notification popups (alert + toast): "Hermes brings word" ----- */
  /* the card's fonts; also used by the notifications page */
  @font-face {
    font-family: 'Cinzel';
    src: url('{{ url_for("views.themes", path="webfonts/cinzel.woff2") }}') format('woff2');
    font-weight: 400 900;
    font-display: swap;
  }
  @font-face {
    font-family: 'Cormorant Garamond';
    src: url('{{ url_for("views.themes", path="webfonts/cormorant-garamond.woff2") }}') format('woff2');
    font-weight: 300 700;
    font-display: swap;
  }

  .notice-card {
    position: relative;
    border: 1px solid rgba(226, 188, 116, 0.22);
    border-radius: 8px;
    background: linear-gradient(180deg, #15120e, #0b0a08);
    color: #f4ead6;
    box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.85);
  }

  /* small gold diamond sitting on the top edge */
  .notice-card::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -5px;
    width: 9px;
    height: 9px;
    margin-left: -4.5px;
    background: #e2bc74;
    transform: rotate(45deg);
  }

  .notice-eyebrow {
    display: flex;
    align-items: center;
    gap: 0.75em;
    font-family: 'Cinzel', 'Voyage Display', Georgia, serif;
    font-weight: 400;
    font-size: 13px;
    line-height: 1.2;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(226, 188, 116, 0.75);
  }
  .notice-eyebrow svg { flex: none; width: 1.45em; height: 1.45em; fill: #e2bc74; }

  .notice-title {
    margin: 0;
    font-family: 'Cinzel', 'Voyage Display', Georgia, serif;
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: 0.01em;
    color: #f2d9a2;
    overflow-wrap: anywhere;
  }

  .notice-text {
    font-family: 'Cormorant Garamond', 'Voyage Serif', Georgia, serif;
    font-weight: 400;
    color: #c2b9a8;
    font-variant-numeric: lining-nums;
  }
  .notice-text p:last-child { margin-bottom: 0; }
  .notice-text strong { color: #f4ead6; font-weight: 600; }
  .notice-text a { color: #e2bc74; }

  /* gold bar button with an inner frame line */
  .notice-btn {
    position: relative;
    display: block;
    width: 100%;
    height: 62px;
    padding: 0 0 0 0.3em;
    border: 0;
    border-radius: 4px;
    background: linear-gradient(180deg, #f2d9a2 0%, #d9b56b 55%, #b98f4c 100%);
    box-shadow: 0 1px 0 rgba(255, 246, 220, 0.25) inset, 0 6px 18px -6px rgba(0, 0, 0, 0.6);
    font-family: 'Cinzel', 'Voyage Display', Georgia, serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #14100a;
    transition: filter 0.15s ease;
  }
  .notice-btn::after {
    content: "";
    position: absolute;
    inset: 5px;
    border: 1px solid rgba(20, 16, 10, 0.35);
    border-radius: 2px;
    pointer-events: none;
  }
  .notice-btn:hover,
  .notice-btn:focus-visible { color: #14100a; filter: brightness(1.06); }
  .notice-btn:focus-visible { outline: 2px solid #f2d9a2; outline-offset: 3px; }

  /* ----- alert modal: notifications sent as alerts ----- */
  .notice-modal .modal-dialog { max-width: 500px; }
  .notice-modal .modal-content {
    padding: 58px 38px 38px;
    border: 1px solid rgba(226, 188, 116, 0.22);
    border-radius: 8px;
    background: linear-gradient(180deg, #15120e, #0b0a08);
  }
  .notice-modal .notice-eyebrow { font-size: 15px; }
  .notice-modal .notice-title { margin-top: 14px; font-size: 28px; }
  .notice-modal .notice-text { margin-top: 16px; font-size: 24px; line-height: 32px; }
  .notice-modal .notice-btn { margin-top: 41px; }

  /* ----- toast: live notifications ----- */
  .notice-toast {
    --bs-toast-max-width: 380px;
    width: 380px;
    max-width: calc(100vw - 2rem);
    padding: 30px 26px 26px;
  }
  .notice-toast .notice-eyebrow { padding-right: 2rem; font-size: 12px; }
  .notice-toast .notice-title { margin-top: 12px; font-size: 20px; }
  .notice-toast .notice-text {
    max-height: 220px;
    margin-top: 10px;
    overflow-y: auto;
    padding: 0;
    font-size: 18px;
    line-height: 1.45;
  }
  .notice-toast .btn-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 0.65em;
    height: 0.65em;
  }

  @media (max-width: 575.98px) {
    .notice-modal .modal-content { padding: 44px 24px 24px; }
    .notice-modal .notice-eyebrow { font-size: 13px; }
    .notice-modal .notice-title { font-size: 23px; }
    .notice-modal .notice-text { font-size: 20px; line-height: 28px; }
    .notice-modal .notice-btn { margin-top: 30px; height: 54px; font-size: 16px; }
  }

  /* ----- tooltips ----- */
  .tooltip {
    --bs-tooltip-bg: #1a1814;
    --bs-tooltip-color: #f4ecdc;
    --bs-tooltip-opacity: 1;
    --bs-tooltip-padding-x: 0.65rem;
    --bs-tooltip-padding-y: 0.3rem;
    --bs-tooltip-font-size: 0.85rem;
    --bs-tooltip-border-radius: 6px;
    font-family: 'Voyage Serif', Georgia, serif;
    font-weight: 500;
  }

  /* ----- snackbar: "email unconfirmed" nudge ----- */
  #ctfdio-snackbar-email-nudge {
    max-width: 440px;
    padding: 0.85rem 2.75rem 0.9rem 1.15rem;
    border: 1px solid rgba(244, 236, 220, 0.12);
    border-left: 2px solid var(--acc);
    border-radius: 10px;
    background: #0b0a08;
    color: rgba(244, 236, 220, 0.75);
    box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.85);
    font-family: 'Voyage Serif', Georgia, serif;
    text-align: left !important;
  }
  #ctfdio-snackbar-email-nudge small { font-size: 1rem; line-height: 1.45; }
  #ctfdio-snackbar-email-nudge strong { font-weight: 500; font-size: 1.05rem; color: #f4ecdc; }
  #ctfdio-snackbar-email-nudge a { color: var(--acc); }
  #ctfdio-snackbar-email-nudge a:hover { color: var(--acc-light); }
  #ctfdio-snackbar-email-nudge .btn-close { top: 50%; transform: translateY(-50%); padding: 0.9rem; }
</style>
