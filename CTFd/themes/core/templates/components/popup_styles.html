<style>
  /* ===== Popups: modals, toasts, tooltips, snackbar =====
     Loaded inside the stylesheets block, straight after main.scss, so a page that
     restyles its own modals (teams, challenge window) still wins the cascade. */

  /* muted cream close cross; also cancels Bootstrap's dark-mode invert filter */
  .modal .btn-close,
  .toast .btn-close,
  #ctfdio-snackbar-email-nudge .btn-close {
    --bs-btn-close-bg: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%23f4ecdc'%3e%3cpath d='M.293.293a1 1 0 0 1 1.414 0L8 6.586 14.293.293a1 1 0 1 1 1.414 1.414L9.414 8l6.293 6.293a1 1 0 0 1-1.414 1.414L8 9.414l-6.293 6.293a1 1 0 0 1-1.414-1.414L6.586 8 .293 1.707a1 1 0 0 1 0-1.414z'/%3e%3c/svg%3e");
    --bs-btn-close-white-filter: none;
    --bs-btn-close-opacity: 0.45;
    --bs-btn-close-hover-opacity: 0.9;
    --bs-btn-close-focus-shadow: 0 0 0 0.2rem rgba(var(--acc-rgb), 0.3);
    filter: none;
  }

  /* ----- any modal ----- */
  .modal {
    --bs-modal-bg: #0b0a08;
    --bs-modal-color: #f4ecdc;
    --bs-modal-border-color: rgba(244, 236, 220, 0.12);
    --bs-modal-border-radius: 12px;
    --bs-modal-inner-border-radius: 11px;
    --bs-modal-box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.8);
    --bs-modal-header-border-color: rgba(244, 236, 220, 0.1);
    --bs-modal-footer-border-color: rgba(244, 236, 220, 0.1);
  }
  .modal-content { box-shadow: var(--bs-modal-box-shadow); }
  .modal-title {
    font-family: 'Voyage Display', 'Voyage Serif', sans-serif;
    font-weight: 700;
    color: var(--acc-light);
  }

  .modal-backdrop {
    --bs-backdrop-bg: #030201;
    --bs-backdrop-opacity: 0.75;
  }

  /* ----- notification popups (alert + toast): "Hermes brings word" -----
     Neutral dark surface, off-white title, gold only on the small quill. */
  .notice-card {
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 14px;
    background: #12100d;
    color: #f4ecdc;
    box-shadow: 0 24px 60px -16px rgba(0, 0, 0, 0.85);
  }

  .notice-eyebrow {
    display: flex;
    align-items: center;
    gap: 0.5em;
    font-family: 'Voyage Serif', system-ui, sans-serif;
    font-weight: 500;
    font-size: 12.5px;
    line-height: 1.2;
    color: rgba(244, 236, 220, 0.5);
  }
  .notice-eyebrow svg { flex: none; width: 1.2em; height: 1.2em; fill: var(--acc); }

  .notice-title {
    margin: 0;
    font-family: 'Voyage Display', 'Voyage Serif', sans-serif;
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: -0.01em;
    color: #f4ecdc;
    overflow-wrap: anywhere;
  }

  .notice-text {
    font-family: 'Voyage Serif', system-ui, sans-serif;
    font-weight: 400;
    line-height: 1.6;
    color: rgba(244, 236, 220, 0.66);
  }
  .notice-text p:last-child { margin-bottom: 0; }
  .notice-text strong { color: #f4ecdc; font-weight: 600; }
  .notice-text a { color: var(--acc-light); text-decoration: underline; text-decoration-color: rgba(var(--acc-rgb), 0.4); text-underline-offset: 3px; }

  /* ----- alert modal: notifications sent as alerts ----- */
  .notice-modal .modal-dialog { max-width: 440px; }
  .notice-modal .modal-content { padding: 28px 28px 30px; }
  .notice-modal .notice-title { margin-top: 12px; font-size: 22px; }
  .notice-modal .notice-text { margin-top: 10px; font-size: 16px; }
  /* the shared 3D push button (base.html), full width */
  .notice-modal .notice-btn { width: 100%; margin-top: 28px; }

  /* ----- toast: live notifications ----- */
  .notice-toast {
    --bs-toast-max-width: 360px;
    width: 360px;
    max-width: calc(100vw - 2rem);
    padding: 18px 20px 20px;
  }
  .notice-toast .notice-eyebrow { padding-right: 2rem; }
  .notice-toast .notice-title { margin-top: 10px; font-size: 17px; }
  .notice-toast .notice-text {
    max-height: 220px;
    margin-top: 6px;
    overflow-y: auto;
    padding: 0;
    font-size: 14.5px;
    line-height: 1.55;
  }
  .notice-toast .btn-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 0.6em;
    height: 0.6em;
  }

  @media (max-width: 575.98px) {
    .notice-modal .modal-content { padding: 24px 22px 26px; }
    .notice-modal .notice-title { font-size: 20px; }
    .notice-modal .notice-text { font-size: 15px; }
  }

  /* ----- tooltips ----- */
  .tooltip {
    --bs-tooltip-bg: #1a1814;
    --bs-tooltip-color: #f4ecdc;
    --bs-tooltip-opacity: 1;
    --bs-tooltip-padding-x: 0.65rem;
    --bs-tooltip-padding-y: 0.3rem;
    --bs-tooltip-font-size: 0.85rem;
    --bs-tooltip-border-radius: 6px;
    font-family: 'Voyage Serif', system-ui, sans-serif;
    font-weight: 500;
  }

  /* ----- snackbar: "email unconfirmed" nudge ----- */
  #ctfdio-snackbar-email-nudge {
    max-width: 440px;
    padding: 0.85rem 2.75rem 0.9rem 1.15rem;
    border: 1px solid rgba(244, 236, 220, 0.12);
    border-left: 2px solid var(--acc);
    border-radius: 10px;
    background: #0b0a08;
    color: rgba(244, 236, 220, 0.75);
    box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.85);
    font-family: 'Voyage Serif', system-ui, sans-serif;
    text-align: left !important;
  }
  #ctfdio-snackbar-email-nudge small { font-size: 1rem; line-height: 1.45; }
  #ctfdio-snackbar-email-nudge strong { font-weight: 500; font-size: 1.05rem; color: #f4ecdc; }
  #ctfdio-snackbar-email-nudge a { color: var(--acc); }
  #ctfdio-snackbar-email-nudge a:hover { color: var(--acc-light); }
  #ctfdio-snackbar-email-nudge .btn-close { top: 50%; transform: translateY(-50%); padding: 0.9rem; }
</style>
